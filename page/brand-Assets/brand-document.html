    .doc-search-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.5rem; }

    }

    // === Renderizado de documentos ===

<script>
    /* Accordion */
   

    function toggleSubGroup(id) {
    var body = document.getElementById(id);
    var arrow = document.getElementById('arrow-' + id);
    var isOpen = body.style.display !== 'none';

    var parentGroup = body.closest('.nav-group');
    if (parentGroup) {
        parentGroup.querySelectorAll('.nav-sub-group-body').forEach(function(otherBody) {
            if (otherBody !== body) {
                otherBody.style.display = 'none';
                var otherHeader = otherBody.previousElementSibling;
                if (otherHeader) {
                    var otherArrow = otherHeader.querySelector('.nav-sub-arrow');
                    if (otherArrow) otherArrow.classList.remove('open');
                }
            }
        });
    }

    if (isOpen) {
        body.style.display = 'none';
        if (arrow) arrow.classList.remove('open');
    } else {
        body.style.display = 'block';
        if (arrow) arrow.classList.add('open');
    }
}

    /* View router */

        overview:          { el:'view-overview',    title:'Dashboard <span>/ Overview</span>' },
        salesByPerfumery:  { el:'view-placeholder', title:'Dashboard <span>/ Sales by Perfumery</span>',  ph:'Sales by Perfumery' },

        salesByCity:       { el:'view-placeholder', title:'Dashboard <span>/ Sales by City</span>',       ph:'Sales by City' },

    function showView(key, linkEl) {
        document.querySelectorAll('.nav-sub-item').forEach(i => i.classList.remove('active'));
        if (linkEl) { linkEl.classList.add('active'); linkEl.closest('.nav-group')?.classList.add('open'); }
        const v = VIEWS[key] || VIEWS.overview;
        ['view-overview','view-commissions','view-placeholder'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
        document.getElementById(v.el).style.display = 'block';
        document.getElementById('topbarTitle').innerHTML = v.title;
        if (v.ph) document.getElementById('placeholderTitle').textContent = v.ph;
        return false;
    }


    /* Tabs */

    };

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === tab));
        const title = TAB_TITLES[tab];
        if (title) document.getElementById('topbarTitle').innerHTML = title;
    }
