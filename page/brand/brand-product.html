<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --gold:rgb(171,160,110);
  --gold-dark:rgb(141,130,80);
  --gold-light:rgba(171,160,110,0.12);
  --gold-border:rgba(171,160,110,0.3);
  --border:#E8E9E9;
  --text:#1E2227;
  --text-muted:#888;
  --card-bg:#fff;
  --radius:10px;
}

/* ── PAGE HEADER ── */
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.page-title-section h2{font-size:1.35rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;}
.page-title-section h2 i{color:var(--gold);}
.page-title-section p{color:var(--text-muted);font-size:13px;margin-top:4px;}

/* ── TABLE CARD ── */
.table-card{background:var(--card-bg);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;border:1px solid var(--border);}

/* ── FILTER ROW inside table ── */
.table-filter-row{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;background:#fafafa;}
.col-filter{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12px;color:var(--text);outline:none;cursor:pointer;min-width:90px;transition:border-color .2s;}
.col-filter:focus{border-color:var(--gold);}
.results-count{margin-left:auto;font-size:12px;color:var(--text-muted);white-space:nowrap;}

/* ── PRODUCTS TABLE ── */
.products-table{width:100%;border-collapse:collapse;}
.products-table thead th{
  background:var(--gold);color:#fff;
  padding:11px 14px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.products-table thead th:hover{background:var(--gold-dark);}
.products-table thead th .sort-icon{font-size:9px;margin-left:4px;opacity:.6;}
.products-table tbody td{
  padding:11px 14px;border-bottom:1px solid var(--border);
  font-size:13px;color:var(--text);vertical-align:middle;
}
.products-table tbody tr:last-child td{border-bottom:none;}
.products-table tbody tr:hover{background:#fafafa;}

/* Photo cell */
.photo-cell{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:#f5f5f5;display:block;}
.photo-placeholder{width:56px;height:56px;border-radius:8px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;border:1px solid var(--gold-border);}
.photo-placeholder i{color:var(--gold);font-size:18px;}

/* SKU */
.sku-cell{font-family:'Courier New',monospace;font-size:11px;color:var(--text-muted);letter-spacing:.03em;}

/* Stock badge */
/* .stock-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.stock-ok{background:#e6f4ea;color:#1e8e3e;}
.stock-low{background:#fff3e0;color:#e65100;}
.stock-out{background:#fce8e8;color:#d93025;} */

/* Collection badge */
.collection-badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600;background:var(--gold-light);color:var(--gold);}

/* Type badge */
.type-badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:500;background:#f0f0f0;color:#555;}

/* Price */
.price-msrp{font-size:13px;color:var(--text-muted);}
.price-wholesale{font-size:13px;font-weight:700;color:var(--gold-dark);}
.price-zero{color:#ccc;}

/* View button */
.btn-view-product{width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;background:#e8f0fe;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .18s;}
.btn-view-product:hover{background: var(--gold);color:#fff;}

/* Empty */
.empty-row td{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-row i{font-size:36px;color:#ddd;display:block;margin-bottom:10px;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.product-modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.28);}
.product-modal-header{background:var(--gold);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;}
.product-modal-header h3{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;}
.modal-close-btn{width:30px;height:30px;border:none;background:rgba(255,255,255,.2);border-radius:50%;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.modal-close-btn:hover{background:rgba(255,255,255,.35);}
.product-modal-body{padding:24px;overflow-y:auto;flex:1;}

/* Modal layout */
.modal-product-layout{display:grid;grid-template-columns:200px 1fr;gap:24px;}
.modal-photos{display:flex;flex-direction:column;gap:10px;}
.modal-main-photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#f5f5f5;}
.modal-main-photo-placeholder{width:100%;aspect-ratio:1;border-radius:10px;background:var(--gold-light);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;}
.modal-main-photo-placeholder i{font-size:40px;color:var(--gold);}
.modal-thumbs{display:flex;gap:6px;}
.modal-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;border:2px solid transparent;cursor:pointer;transition:border-color .2s;}
.modal-thumb.active,.modal-thumb:hover{border-color:var(--gold);}

.modal-info{}
.modal-product-name{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.modal-product-sub{font-size:13px;color:var(--text-muted);margin-bottom:14px;}
.modal-price{font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:16px;}
.modal-description{font-size:13px;color:#444;line-height:1.6;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}

.modal-notes{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.note-row{display:flex;gap:6px;margin-bottom:6px;font-size:12px;}
.note-label{font-weight:700;color:var(--text);min-width:90px;}
.note-value{color:#555;}

.modal-specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.spec-item{background:#f9f9f9;border-radius:8px;padding:10px 13px;}
.spec-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.spec-value{font-size:13px;font-weight:600;color:var(--text);}

.modal-guidelines{background:var(--gold-light);border-radius:8px;padding:14px 16px;}
.modal-guidelines-title{font-size:12px;font-weight:700;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.guideline-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.guideline-label{color:var(--text-muted);}
.guideline-value{font-weight:600;color:var(--text);}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:3000;background:#1E2227;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:0 6px 20px rgba(0,0,0,.22);transform:translateY(60px);opacity:0;transition:all .28s ease;}
.toast.show{transform:translateY(0);opacity:1;}
.toast i{color:var(--gold);}

@media(max-width:620px){
  .modal-product-layout{grid-template-columns:1fr;}
  .modal-photos{flex-direction:row;align-items:flex-start;}
  .modal-main-photo,.modal-main-photo-placeholder{width:120px;flex-shrink:0;}
  .modal-specs-grid{grid-template-columns:1fr;}
}

/* En el <style> */
.btn-download-product{width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;background:#fff;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .18s;margin:0 auto;}

.products-table thead th select option {
  background: #1E2227;
  color: #fff;
}
.products-table thead th {
  vertical-align: top;
}

    document.getElementById('brandTitle').textContent = savedBrand;
    applyProductsBrand(savedBrand);

    renderProducts(); // ← verifica el nombre real de tu función
  }

// ── Función principal ─────────────────────────────────────────
function applyProductsBrand(brand) {
  if (BRAND_PRODUCTS[brand]) {
    products = BRAND_PRODUCTS[brand];
    renderProducts(); // ← verifica el nombre real de tu función
  }
}

var sortCol = null;
var sortDir = 1;
var viewingProduct = null;

/* ════════ POPULATE FILTERS ════════ */
function populateFilters() {
  var collections = [...new Set(products.map(function(p){ return p.collection; }))].sort();
  var perfumes    = [...new Set(products.map(function(p){ return p.perfume; }))].sort();
  var types       = [...new Set(products.map(function(p){ return p.type; }))].sort();
  var mls         = [...new Set(products.map(function(p){ return p.ml; }))].sort(function(a,b){return a-b;});
  var wholesales  = [...new Set(products.map(function(p){ return p.wholesale; }))].sort(function(a,b){return a-b;});

  function fillSelect(id, values, prefix) {
    var sel = document.getElementById(id);
    values.forEach(function(v) {
      var o = document.createElement('option');
      o.value = v; o.textContent = (prefix||'') + v;
      sel.appendChild(o);
    });
  }
  fillSelect('fCollection', collections);
  fillSelect('fPerfume', perfumes);
  fillSelect('fType', types);
  fillSelect('fMl', mls, '');
  fillSelect('fWholesale', wholesales, '$');
}

/* ════════ RENDER TABLE ════════ */
function renderProducts() {
  var tbody = document.getElementById('productsTableBody');
  var fSku        = document.getElementById('fSku') ? document.getElementById('fSku').value.toLowerCase() : '';
  var fCollection = document.getElementById('fCollection').value;
  var fPerfume    = document.getElementById('fPerfume').value;
  var fType       = document.getElementById('fType').value;
  var fMl         = document.getElementById('fMl').value;
  var fMsrp       = document.getElementById('fMsrp').value;
  var fWholesale  = document.getElementById('fWholesale').value;

  var filtered = products.filter(function(p) {
    var msrpOk = !fMsrp ||
      (fMsrp==='0'   && p.msrp === 0) ||
      (fMsrp==='gt0' && p.msrp > 0);
    return (!fSku        || p.sku.toLowerCase().includes(fSku))
      && (!fCollection || p.collection === fCollection)
      && (!fPerfume    || p.perfume    === fPerfume)
      && (!fType       || p.type       === fType)
      && (!fMl         || String(p.ml) === String(fMl))
      && msrpOk
      && (!fWholesale  || String(p.wholesale) === String(fWholesale));
  });

  if (sortCol) {
    filtered.sort(function(a,b) {
      var av = a[sortCol], bv = b[sortCol];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }

  document.getElementById('resultsCount').textContent = filtered.length + ' product' + (filtered.length!==1?'s':'');

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10"><i class="fas fa-search"></i><p>No products match the selected filters.</p></td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(function(p) {
    var photoHtml = p.photo
      ? '<img src="'+p.photo+'" class="photo-cell" alt="'+p.perfume+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="photo-placeholder" style="display:none;"><i class="fas fa-spray-can"></i></div>'
      : '<div class="photo-placeholder"><i class="fas fa-spray-can"></i></div>';
    var msrpHtml = p.msrp > 0
      ? '<span class="price-msrp">$'+p.msrp.toFixed(2)+'</span>'
      : '<span class="price-zero">$0</span>';
    return '<tr>' +
      '<td style="text-align:center;"><button class="btn-view-product" onclick="openProductModal('+p.id+')" title="View details"><i class="fas fa-eye"></i></button></td>' +
      '<td><span class="sku-cell">'+p.sku+'</span></td>' +
      '<td style="text-align:center;">'+photoHtml+'</td>' +
      '<td><span class="collection-badge">'+p.collection+'</span></td>' +
      '<td style="font-weight:500;">'+p.perfume+'</td>' +
      '<td><span class="type-badge">'+p.type+'</span></td>' +
      '<td style="text-align:center;font-size:13px;">'+p.ml+' ml</td>' +
      '<td>'+msrpHtml+'</td>' +
      '<td><span class="price-wholesale">$'+p.wholesale.toFixed(2)+'</span></td>' +
      '<td style="text-align:center;">'+
  (p.active
    ? '<span style="background:#e6f4ea;color:#1e8e3e;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;">Yes</span>'
    : '<span style="background:#fce8e8;color:#d93025;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;">No</span>')+
'</td>' +
'<td style="text-align:center;">'+
  (p.niche
    ? '<span style="background:#e8f0fe;color:#1a73e8;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;">Yes</span>'
    : '<span style="background:#f0f0f0;color:#888;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;">No</span>')+
'</td>' +
      '<td style="text-align:center;"><button class="btn-download-product" onclick="downloadProduct('+p.id+')" title="Download info"><i class="fas fa-download"></i></button></td>' +
    '</tr>';
  }).join('');
}
/* ════════ SORT ════════ */
function sortProducts(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderProducts();
}

/* ════════ PRODUCT MODAL ════════ */
function openProductModal(id) {
  viewingProduct = products.find(function(p){ return p.id === id; });
  if (!viewingProduct) return;
  var p = viewingProduct;

  /* Main photo */
  var mainPhotoEl = document.getElementById('modalMainPhoto');
  if (p.photo) {
    mainPhotoEl.innerHTML = '<img src="'+p.photo+'" class="modal-main-photo" id="modalMainImg" alt="'+p.perfume+'" onerror="this.parentElement.innerHTML=\'<div class=modal-main-photo-placeholder><i class=fas fa-spray-can></i></div>\'">';
  } else {
    mainPhotoEl.innerHTML = '<div class="modal-main-photo-placeholder"><i class="fas fa-spray-can"></i></div>';
  }

  /* Thumbs */
  var thumbsEl = document.getElementById('modalThumbs');
  if (p.photos && p.photos.length > 1) {
    thumbsEl.innerHTML = p.photos.map(function(src, i) {
      return '<img src="'+src+'" class="modal-thumb'+(i===0?' active':'')+'" onclick="switchPhoto(this,\''+src+'\')" onerror="this.style.display=\'none\'">';
    }).join('');
  } else {
    thumbsEl.innerHTML = '';
  }

  /* Info */
  document.getElementById('modalName').textContent = p.perfume;
  document.getElementById('modalSub').textContent = p.collection + ' | ' + p.ml + ' ml';
  document.getElementById('modalPrice').textContent = p.wholesale > 0 ? '$'+p.wholesale.toFixed(2) : 'Price on request';
  document.getElementById('modalDesc').textContent = p.description || '';

  /* Notes */
  var notesHtml = '';
  if (p.topNotes && p.topNotes.length)    notesHtml += '<div class="note-row"><span class="note-label">Top Notes:</span><span class="note-value">'+p.topNotes.join(', ')+'</span></div>';
  if (p.middleNotes && p.middleNotes.length) notesHtml += '<div class="note-row"><span class="note-label">Middle Notes:</span><span class="note-value">'+p.middleNotes.join(', ')+'</span></div>';
  if (p.baseNotes && p.baseNotes.length)  notesHtml += '<div class="note-row"><span class="note-label">Base Notes:</span><span class="note-value">'+p.baseNotes.join(', ')+'</span></div>';
  document.getElementById('modalNotes').innerHTML = notesHtml || '';
  document.getElementById('modalNotes').style.display = notesHtml ? '' : 'none';

  /* Specs */
  var stockClass = p.stock > 20 ? '#1e8e3e' : p.stock > 0 ? '#e65100' : '#d93025';
  document.getElementById('modalSpecs').innerHTML =
    '<div class="spec-item"><div class="spec-label">SKU</div><div class="spec-value" style="font-size:11px;font-family:monospace;">'+p.sku+'</div></div>' +
    '<div class="spec-item"><div class="spec-label">Type</div><div class="spec-value">'+p.type+'</div></div>' +
    '<div class="spec-item"><div class="spec-label">Size</div><div class="spec-value">'+p.ml+' ml</div></div>' +
    '<div class="spec-item"><div class="spec-label">MSRP</div><div class="spec-value">'+(p.msrp > 0 ? '$'+p.msrp.toFixed(2) : '—')+'</div></div>' +
    '<div class="spec-item"><div class="spec-label">Wholesale</div><div class="spec-value" style="color:var(--gold-dark);">$'+p.wholesale.toFixed(2)+'</div></div>';

  /* Guidelines */
//   document.getElementById('modalGuidelines').innerHTML =
//     '<div class="modal-guidelines-title"><i class="fas fa-clipboard-list" style="margin-right:6px;"></i>Product Guidelines</div>' +
//     '<div class="guideline-row"><span class="guideline-label">First Order:</span><span class="guideline-value">'+p.firstOrder+' Unit'+(p.firstOrder!==1?'s':'')+'</span></div>' +
//     '<div class="guideline-row"><span class="guideline-label">Next Order:</span><span class="guideline-value">'+(p.nextOrder||'—')+'</span></div>';

  document.getElementById('productModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchPhoto(thumb, src) {
  document.getElementById('modalMainImg') && (document.getElementById('modalMainImg').src = src);
  document.querySelectorAll('.modal-thumb').forEach(function(t){ t.classList.remove('active'); });
  thumb.classList.add('active');
}

function closeProductModal(e) {
  if (e && e.target !== document.getElementById('productModal')) return;
  document.getElementById('productModal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ════════ NAV ════════ */
function toggleGroup(id) {
  var grp = document.getElementById(id);
  var wasOpen = grp.classList.contains('open');
  document.querySelectorAll('.nav-group').forEach(function(g){
    if (g.id!==id && !g.querySelector('.active')) g.classList.remove('open');
  });
  if (wasOpen && !grp.querySelector('.active')) grp.classList.remove('open');
  else grp.classList.add('open');
}

function toggleSubGroup(id) {
  var body = document.getElementById(id);
  var arrow = document.getElementById('arrow-'+id);
  var isOpen = body.style.display !== 'none';
  if (isOpen && !body.querySelector('.active')) {
    body.style.display='none';
    if(arrow) arrow.classList.remove('open');
  } else {
    body.style.display='block';
    if(arrow) arrow.classList.add('open');
  }
}

/* ════════ ESC ════════ */
document.addEventListener('keydown', function(e) {
  if (e.key==='Escape') closeProductModal();
});

/* ════════ INIT ════════ */
document.addEventListener('DOMContentLoaded', function() {
  populateFilters();
  renderProducts();

  // Open Sales sub-group since this page is inside it
  var salesBody = document.getElementById('grp-sales');
  var salesArrow = document.getElementById('arrow-grp-sales');
  if (salesBody) { salesBody.style.display = 'block'; }
  if (salesArrow) { salesArrow.classList.add('open'); }
});

/* En el <script> */
function downloadProduct(id) {
  var p = products.find(function(x){ return x.id === id; });
  if (!p) return;
  var content = [
    'SKU: ' + p.sku,
    'Perfume: ' + p.perfume,
    'Collection: ' + p.collection,
    'Type: ' + p.type,
    'Size: ' + p.ml + ' ml',
    'MSRP: ' + (p.msrp > 0 ? '$' + p.msrp.toFixed(2) : '$0'),
    'Wholesale Price: $' + p.wholesale.toFixed(2),
    '',
    'Description:',
    p.description || '',
    '',
    'Top Notes: ' + (p.topNotes ? p.topNotes.join(', ') : '—'),
    'Middle Notes: ' + (p.middleNotes ? p.middleNotes.join(', ') : '—'),
    'Base Notes: ' + (p.baseNotes ? p.baseNotes.join(', ') : '—'),
    '',
    'First Order: ' + p.firstOrder + ' unit(s)',
    'Next Order: ' + (p.nextOrder || '—')
  ].join('\n');

  var blob = new Blob([content], { type: 'text/plain' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = p.sku + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
