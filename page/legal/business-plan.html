<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --gold:rgb(171,160,110);
  --gold-dark:rgb(141,130,80);
  --gold-light:rgba(171,160,110,0.12);
  --gold-border:rgba(171,160,110,0.3);
  --border:#E8E9E9;
  --text:#1E2227;
  --text-muted:#888;
  --card-bg:#fff;
  --radius:10px;
}

/* â”€â”€ PAGE HEADER â”€â”€ */
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.page-title-section h2{font-size:1.35rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;}
.page-title-section h2 i{color:var(--gold);}
.page-title-section p{color:var(--text-muted);font-size:13px;margin-top:4px;}

/* â”€â”€ TABLE CARD â”€â”€ */
.table-card{background:var(--card-bg);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;border:1px solid var(--border);}

/* â”€â”€ FILTER ROW inside table â”€â”€ */
.table-filter-row{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;background:#fafafa;}
.col-filter{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12px;color:var(--text);outline:none;cursor:pointer;min-width:90px;transition:border-color .2s;}
.col-filter:focus{border-color:var(--gold);}
.results-count{margin-left:auto;font-size:12px;color:var(--text-muted);white-space:nowrap;}

/* â”€â”€ PRODUCTS TABLE â”€â”€ */
.products-table{width:100%;border-collapse:collapse;}
.products-table thead th{
  background:var(--gold);color:#fff;
  padding:11px 14px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.products-table thead th:hover{background:var(--gold-dark);}
.products-table thead th .sort-icon{font-size:9px;margin-left:4px;opacity:.6;}
.products-table tbody td{
  padding:11px 14px;border-bottom:1px solid var(--border);
  font-size:13px;color:var(--text);vertical-align:middle;
}
.products-table tbody tr:last-child td{border-bottom:none;}
.products-table tbody tr:hover{background:#fafafa;}

/* Photo cell */
.photo-cell{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:#f5f5f5;display:block;}
.photo-placeholder{width:56px;height:56px;border-radius:8px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;border:1px solid var(--gold-border);}
.photo-placeholder i{color:var(--gold);font-size:18px;}

/* SKU */
.sku-cell{font-family:'Courier New',monospace;font-size:11px;color:var(--text-muted);letter-spacing:.03em;}

/* Stock badge */
/* .stock-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}

.stock-low{background:#fff3e0;color:#e65100;}

/* Collection badge */
.collection-badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600;background:var(--gold-light);color:var(--gold);}

/* Type badge */
.type-badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:500;background:#f0f0f0;color:#555;}

/* Price */
.price-msrp{font-size:13px;color:var(--text-muted);}
.price-wholesale{font-size:13px;font-weight:700;color:var(--gold-dark);}

/* View button */
.btn-view-product{width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;background:#e8f0fe;color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .18s;}
.btn-view-product:hover{background: var(--gold);color:#fff;}

/* Empty */
.empty-row td{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-row i{font-size:36px;color:#ddd;display:block;margin-bottom:10px;}

/* â”€â”€ MODAL â”€â”€ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.product-modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.28);}
.product-modal-header{background:var(--gold);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;}
.product-modal-header h3{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;}
.modal-close-btn{width:30px;height:30px;border:none;background:rgba(255,255,255,.2);border-radius:50%;color:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.modal-close-btn:hover{background:rgba(255,255,255,.35);}
.product-modal-body{padding:24px;overflow-y:auto;flex:1;}

/* Modal layout */
.modal-product-layout{display:grid;grid-template-columns:200px 1fr;gap:24px;}
.modal-photos{display:flex;flex-direction:column;gap:10px;}
.modal-main-photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#f5f5f5;}
.modal-main-photo-placeholder{width:100%;aspect-ratio:1;border-radius:10px;background:var(--gold-light);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;}
.modal-main-photo-placeholder i{font-size:40px;color:var(--gold);}
.modal-thumbs{display:flex;gap:6px;}
.modal-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;border:2px solid transparent;cursor:pointer;transition:border-color .2s;}
.modal-thumb.active,.modal-thumb:hover{border-color:var(--gold);}

.modal-product-name{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.modal-product-sub{font-size:13px;color:var(--text-muted);margin-bottom:14px;}
.modal-price{font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:16px;}
.modal-description{font-size:13px;color:#444;line-height:1.6;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}

.modal-notes{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.note-row{display:flex;gap:6px;margin-bottom:6px;font-size:12px;}
.note-label{font-weight:700;color:var(--text);min-width:90px;}
.note-value{color:#555;}

.modal-specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.spec-item{background:#f9f9f9;border-radius:8px;padding:10px 13px;}
.spec-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.spec-value{font-size:13px;font-weight:600;color:var(--text);}

.modal-guidelines{background:var(--gold-light);border-radius:8px;padding:14px 16px;}
.modal-guidelines-title{font-size:12px;font-weight:700;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.guideline-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.guideline-label{color:var(--text-muted);}
.guideline-value{font-weight:600;color:var(--text);}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:3000;background:#1E2227;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:0 6px 20px rgba(0,0,0,.22);transform:translateY(60px);opacity:0;transition:all .28s ease;}

/* â•â•â•â•â•â•â•â• HELPERS â•â•â•â•â•â•â•â• */
function formatDate(d) {
  if (!d) return 'â€”';
  var p = d.split('-');
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[parseInt(p[1])-1]+' '+parseInt(p[2])+', '+p[0];
}

function getStatus(expiresAt) {
  if (!expiresAt) return { label:'Active', cls:'doc-active' };
  var now = new Date();
  var exp = new Date(expiresAt);
  var diff = (exp - now) / (1000*60*60*24);
  if (diff < 0)  return { label:'Expired',       cls:'doc-expired' };
  if (diff < 30) return { label:'Expiring Soon', cls:'doc-expiring' };
  return { label:'Active', cls:'doc-active' };
}

function getRestrictionClass(r) {
  if (r === 'Confidential')  return 'restriction-confidential';
  if (r === 'Internal Use')  return 'restriction-internal';
  return 'restriction-public';
}

function renderDocs() {
  var tbody = document.getElementById('docsTableBody');
  var fSearch      = document.getElementById('fSearch').value.toLowerCase();
  var fStatus      = document.getElementById('fStatus').value;
  var fRestriction = document.getElementById('fRestriction').value;

  var filtered = docs.filter(function(d) {
    var st = getStatus(d.expiresAt);
    return (d.name.toLowerCase().includes(fSearch) || (d.description||'').toLowerCase().includes(fSearch))
      && (!fStatus      || st.label === fStatus)
      && (!fRestriction || d.restriction === fRestriction);
  });

  if (sortCol) {
    filtered.sort(function(a,b) {
      var av = a[sortCol]||'', bv = b[sortCol]||'';
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }

  document.getElementById('resultsCount').textContent = filtered.length + ' document' + (filtered.length!==1?'s':'');

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8"><i class="fas fa-file-alt"></i><p>No documents found.</p></td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(function(d) {
    var st = getStatus(d.expiresAt);
    var rc = getRestrictionClass(d.restriction);
    var expColor = d.expiresAt && new Date(d.expiresAt) < new Date() ? 'color:#d93025;' : new Date(d.expiresAt) - new Date() < 30*24*60*60*1000 ? 'color:#e65100;' : '';
    return '<tr>' +
      '<td style="font-weight:600;font-size:13px;"><i class="fas fa-file-pdf" style="color:var(--gold);margin-right:7px;"></i>'+d.name+'</td>' +
      '<td style="font-size:12px;color:var(--text-muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+d.description+'">'+d.description+'</td>' +
      '<td style="font-size:12px;white-space:nowrap;">'+formatDate(d.createdAt)+'</td>' +
      '<td style="font-size:12px;white-space:nowrap;'+expColor+'">'+formatDate(d.expiresAt)+'</td>' +
      '<td><span class="restriction-badge '+rc+'">'+d.restriction+'</span></td>' +
      '<td style="text-align:center;"><span class="doc-status '+st.cls+'">'+st.label+'</span></td>' +
      '<td style="text-align:center;"><button class="btn-view-product" onclick="openViewModal('+d.id+')" title="View"><i class="fas fa-eye"></i></button></td>' +
      '<td style="text-align:center;"><button class="btn-download-product" onclick="downloadDoc('+d.id+')" title="Download"><i class="fas fa-download"></i></button></td>' +
    '</tr>';
  }).join('');
}

function sortDocs(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderDocs();
}

/* â•â•â•â•â•â•â•â• ADD / EDIT MODAL â•â•â•â•â•â•â•â• */
function openAddModal() {
  editingDocId = null;
  selectedFile = null;
  document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Add Legal Document';
  clearDocForm();
  document.getElementById('formModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openEditModal(id) {
  editingDocId = id;
  selectedFile = null;
  var d = docs.find(function(x){ return x.id===id; });
  if (!d) return;
  document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-pen"></i> Edit Document';
  document.getElementById('fieldDocName').value = d.name;
  document.getElementById('fieldDocDesc').value = d.description||'';
  document.getElementById('fieldDocCreated').value = d.createdAt||'';
  document.getElementById('fieldDocExpires').value = d.expiresAt||'';
  document.getElementById('fieldDocRestriction').value = d.restriction||'';
  if (d.file) {
    var area = document.getElementById('docUploadArea');
    area.classList.add('has-file');
    document.getElementById('docUploadIcon').className = 'fas fa-check-circle';
    document.getElementById('docUploadPrompt').textContent = 'File attached â€” click to replace';
    document.getElementById('docFileSelectedName').textContent = d.file;
  }
  document.getElementById('formModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function clearDocForm() {
  document.getElementById('fieldDocName').value = '';
  document.getElementById('fieldDocDesc').value = '';
  document.getElementById('fieldDocCreated').value = new Date().toISOString().split('T')[0];
  document.getElementById('fieldDocExpires').value = '';
  document.getElementById('fieldDocRestriction').value = '';
  document.getElementById('docFileInput').value = '';
  var area = document.getElementById('docUploadArea');
  area.classList.remove('has-file');
  document.getElementById('docUploadIcon').className = 'fas fa-cloud-upload-alt';
  document.getElementById('docUploadPrompt').textContent = 'Click to upload or drag and drop';
  document.getElementById('docFileSelectedName').textContent = 'No file selected';
}

function handleDocFileSelect(input) {
  if (!input.files || !input.files[0]) return;
  selectedFile = input.files[0];
  var area = document.getElementById('docUploadArea');
  area.classList.add('has-file');
  document.getElementById('docUploadIcon').className = 'fas fa-check-circle';
  document.getElementById('docUploadPrompt').textContent = 'File selected â€” click to change';
  document.getElementById('docFileSelectedName').textContent = selectedFile.name;
  if (!document.getElementById('fieldDocName').value) {
    document.getElementById('fieldDocName').value = selectedFile.name.replace(/\.[^/.]+$/,'').replace(/[-_]/g,' ');
  }
}

function saveDoc() {
  var name = document.getElementById('fieldDocName').value.trim();
  if (!name) { showToast('Please enter a document name.', true); return; }
  var doc = {
    name: name,
    description: document.getElementById('fieldDocDesc').value.trim(),
    createdAt: document.getElementById('fieldDocCreated').value,
    expiresAt: document.getElementById('fieldDocExpires').value,
    restriction: document.getElementById('fieldDocRestriction').value || 'Internal Use',
    file: selectedFile ? selectedFile.name : (editingDocId ? (docs.find(function(x){return x.id===editingDocId;})||{}).file||'' : ''),
    url: selectedFile ? URL.createObjectURL(selectedFile) : (editingDocId ? (docs.find(function(x){return x.id===editingDocId;})||{}).url||'#' : '#')
  };
  if (editingDocId) {
    var idx = docs.findIndex(function(x){ return x.id===editingDocId; });
    if (idx>-1){ doc.id=editingDocId; docs[idx]=doc; }
    showToast('Document updated!');
  } else {
    doc.id = nextDocId++;
    docs.push(doc);
    showToast('Document added!');
  }
  closeFormModal();
  renderDocs();
}

function closeFormModal(e) {
  if (e && e.target !== document.getElementById('formModal')) return;
  document.getElementById('formModal').classList.remove('open');
  document.body.style.overflow = '';
}

/* â•â•â•â•â•â•â•â• VIEW MODAL â•â•â•â•â•â•â•â• */
function openViewModal(id) {
  viewingDoc = docs.find(function(d){ return d.id===id; });
  if (!viewingDoc) return;
  var d = viewingDoc;
  var st = getStatus(d.expiresAt);
  var rc = getRestrictionClass(d.restriction);
  document.getElementById('viewDocContent').innerHTML =
    '<div class="doc-view-grid">' +
      '<div class="doc-view-item full"><div class="doc-view-label">Document Name</div><div class="doc-view-value"><i class="fas fa-file-pdf" style="color:var(--gold);margin-right:6px;"></i>'+d.name+'</div></div>' +
      '<div class="doc-view-item full"><div class="doc-view-label">Description</div><div class="doc-view-value" style="font-weight:400;font-size:13px;color:#555;">'+( d.description||'â€”')+'</div></div>' +
      '<div class="doc-view-item"><div class="doc-view-label">Created Date</div><div class="doc-view-value">'+formatDate(d.createdAt)+'</div></div>' +
      '<div class="doc-view-item"><div class="doc-view-label">Expiration Date</div><div class="doc-view-value">'+formatDate(d.expiresAt)+'</div></div>' +
      '<div class="doc-view-item"><div class="doc-view-label">Restriction</div><div class="doc-view-value"><span class="restriction-badge '+rc+'">'+d.restriction+'</span></div></div>' +
      '<div class="doc-view-item"><div class="doc-view-label">Status</div><div class="doc-view-value"><span class="doc-status '+st.cls+'">'+st.label+'</span></div></div>' +
      '<div class="doc-view-item full"><div class="doc-view-label">File</div><div class="doc-view-value" style="font-size:12px;font-family:monospace;">'+(d.file||'â€”')+'</div></div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;">' +
      '<button class="btn-save" onclick="downloadDoc('+d.id+')" style="flex:1;"><i class="fas fa-download" style="margin-right:7px;"></i>Download</button>' +
      '<button class="btn-cancel" onclick="closeViewModal();openEditModal('+d.id+')" style="flex:1;"><i class="fas fa-pen" style="margin-right:7px;"></i>Edit</button>' +
    '</div>';
  document.getElementById('viewModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeViewModal(e) {
  if (e && e.target !== document.getElementById('viewModal')) return;
  document.getElementById('viewModal').classList.remove('open');
  document.body.style.overflow = '';
}


function downloadDoc(id) {
  var d = docs.find(function(x){ return x.id===id; });
  if (!d) return;
  if (d.url && d.url !== '#') { window.open(d.url,'_blank'); return; }
  var content = ['Document: '+d.name,'Description: '+(d.description||'â€”'),'Created: '+formatDate(d.createdAt),'Expires: '+formatDate(d.expiresAt),'Restriction: '+d.restriction,'File: '+(d.file||'â€”')].join('\n');
  var blob = new Blob([content], {type:'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (d.file || d.name.replace(/ /g,'_')+'.txt');
  a.click();
}


function showToast(msg, isError) {
  var toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.querySelector('i').style.color = isError ? '#ff6b6b' : 'var(--gold)';
  toast.classList.add('show');
  setTimeout(function(){ toast.classList.remove('show'); }, 3000);
}


function toggleGroup(id) {
  var grp = document.getElementById(id);
  var wasOpen = grp.classList.contains('open');
  document.querySelectorAll('.nav-group').forEach(function(g){
    if (g.id!==id && !g.querySelector('.active')) g.classList.remove('open');
  });
  if (wasOpen && !grp.querySelector('.active')) grp.classList.remove('open');
  else grp.classList.add('open');
}

function toggleSubGroup(id) {
  var body = document.getElementById(id);
  var arrow = document.getElementById('arrow-'+id);
  var isOpen = body.style.display !== 'none';
  if (isOpen && !body.querySelector('.active')) {
    body.style.display='none';
    if(arrow) arrow.classList.remove('open');
  } else {
    body.style.display='block';
    if(arrow) arrow.classList.add('open');
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key==='Escape') {
    closeFormModal(); closeViewModal();
  }
});

document.addEventListener('DOMContentLoaded', function() {
  renderDocs();
  var salesBody = document.getElementById('grp-sales');
  var salesArrow = document.getElementById('arrow-grp-sales');
  if (salesBody) salesBody.style.display = 'block';
  if (salesArrow) salesArrow.classList.add('open');
});
</script>
