<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Networks â€“ By Audience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../../css/dashboard.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#F4F4F2;color:#1E2227;display:flex;min-height:100vh;}
    :root{
      --gold:rgb(171,160,110);--gold-dark:rgb(141,130,80);--gold-light:rgba(171,160,110,0.12);
      --card-bg:#fff;--border:#E8E9E9;--text:#1E2227;--text-muted:#888;--radius:10px;
    }
    .nav-group-header{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;cursor:pointer;color:rgba(255,255,255,.55);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:color .2s;}
    .nav-group-header:hover{color:#fff;}
    .nav-group-arrow{font-size:10px;transition:transform .25s;}
    .nav-group.open .nav-group-arrow{transform:rotate(180deg);}
    .nav-group-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
    .nav-group.open .nav-group-body{max-height:600px;}
    .aside-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.07);}
    .aside-footer a{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;transition:color .2s;}
    .main-wrap{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50;}
    /* .topbar-title{font-size:15px;font-weight:600;color:var(--text);}
    .topbar-title span{color:var(--text-muted);font-weight:400;} */
    .topbar-actions{display:flex;align-items:center;gap:10px;}
    .topbar-btn{width:34px;height:34px;border:none;background:transparent;cursor:pointer;border-radius:8px;color:var(--text-muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
    .topbar-btn:hover{background:#f0f0f0;}
    .topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
    .content{padding:28px;flex:1;}
    .welcome-bar{background:var(--card-bg);border-radius:var(--radius);padding:22px 26px;margin-bottom:28px;border:1px solid var(--border);}
    .welcome-bar h2{font-size:1.4rem;font-weight:700;color:var(--text);}
    .welcome-bar h2 span{color:var(--gold);}

    /* â”€â”€ METRIC CARDS (4) â”€â”€ */
    .metric-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
    .metric-card{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
    .metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--mc-color,var(--gold));}
    .metric-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px);}
    .metric-card.active{border-color:var(--mc-color);box-shadow:0 0 0 2px var(--mc-color);}
    .mc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .mc-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;background:var(--mc-color,var(--gold));}
    .mc-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;transition:all .2s;}
    .metric-card.active .mc-check{background:var(--mc-color);border-color:var(--mc-color);color:#fff;}
    .mc-label{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
    .mc-val{font-size:20px;font-weight:700;color:var(--text);margin:3px 0;}
    .mc-sub{font-size:11px;color:var(--text-muted);margin-bottom:4px;}
    .mc-growth{font-size:11px;color:#4CAF50;display:flex;align-items:center;gap:3px;}
    .mc-growth.down{color:#e53935;}

    /* â”€â”€ FILTERS â”€â”€ */
    .filters-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
    .filter-container{display:flex;gap:8px;flex-wrap:wrap;}
    .filter-btn{padding:9px 18px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#535255;transition:all .25s;}
    .filter-btn:hover{border-color:var(--gold);color:var(--gold);}
    .filter-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);}

    /* â”€â”€ SECTION TITLE â”€â”€ */
    .section-title{color:var(--gold);font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:9px;}

    /* â”€â”€ TABLE â”€â”€ */
    .table-wrapper{overflow-x:auto;border-radius:12px;margin-bottom:30px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
    .responsive-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;}
    .responsive-table thead th{background:var(--gold);color:#fff;padding:13px 12px;text-align:left;font-size:13px;font-weight:600;text-transform:uppercase;white-space:nowrap;}
    .responsive-table thead th:not(:first-child){text-align:center;}
    .responsive-table tbody td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text);vertical-align:middle;text-align:center;}
    .responsive-table tbody td:first-child{text-align:left;}
    .responsive-table tbody tr:last-child td{border-bottom:none;}
    .responsive-table tbody tr:hover{background:#fafafa;}
    .responsive-table .total-row{background:#f5f5f5;border-top:2px solid var(--gold);}
    .responsive-table .total-row td{font-weight:600;}
    .th-content{display:flex;flex-direction:column;align-items:center;gap:1px;}
    .th-month{font-size:13px;font-weight:600;}
    .th-year{font-size:11px;font-weight:400;opacity:.8;}

    /* Metric main rows */
    .metric-main-row{background:rgba(171,160,110,.06);transition:background .15s;}
    .metric-main-row:hover{background:rgba(171,160,110,.12);}
    .metric-main-cell{display:flex;align-items:center;gap:10px;}
    .metric-main-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;}
    .toggle-icon{color:var(--gold);font-size:10px;display:inline-block;margin-right:4px;cursor:pointer;}

    /* Platform sub-rows */
    .platform-sub-row{background:#fff;}
    .platform-sub-row:hover{background:#f9f9f9;}
    .platform-sub-cell{display:flex;align-items:center;gap:10px;padding-left:28px!important;}
    .platform-sub-badge{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;}

    /* â”€â”€ CHART â”€â”€ */
    .chart-container{background:#fff;border-radius:12px;padding:25px;margin-top:20px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.07);}
    .chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
    .chart-title{margin:0;font-size:16px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
    .chart-type-wrap{display:flex;gap:5px;background:#f5f5f5;padding:4px;border-radius:8px;}
    .chart-type-btn{padding:7px 14px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:#535255;display:flex;align-items:center;gap:5px;transition:all .2s;}
    .chart-type-btn.active{background:white;color:var(--gold);box-shadow:0 2px 4px rgba(0,0,0,.1);}
    .chart-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:15px;padding-top:15px;border-top:1px solid var(--border);}

    @media(max-width:1100px){.metric-cards{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:768px){.main-wrap{margin-left:0;}.content{padding:16px;}.filters-row{flex-direction:column;align-items:flex-start;}}
  </style>
  <script src="../../js/aside.js"></script>
</head>
<body>
<div id="aside-root"></div>
<div class="main-wrap">
  <header class="topbar">
  <div class="topbar-title" id="topbarTitle"> <span>BRAND PORTAL</span></div>
    <div class="topbar-actions">
      <button class="topbar-btn"><i class="fas fa-bell"></i></button>
      <button class="topbar-btn"><i class="fas fa-search"></i></button>
      <div class="topbar-avatar">FS</div>
    </div>
  </header>
  <main class="content">

    <div class="welcome-bar">
      <div><h2>Social Networks â€” <span>By Audience</span></h2></div>
    </div>

    <!-- METRIC CARDS -->
    <div class="metric-cards" id="metricCards"></div>

    <!-- FILTERS -->
    <div class="filters-row">
      <div class="filter-container" id="dateFilters">
        <button class="filter-btn" data-filter="yearly"       onclick="applyFilter('yearly')">Yearly</button>
        <button class="filter-btn active" data-filter="lastYear" onclick="applyFilter('lastYear')">Last 13 months</button>
        <button class="filter-btn" data-filter="currentMonth" onclick="applyFilter('currentMonth')">Current Month</button>
      </div>
    </div>

    <h3 class="section-title"><i class="fas fa-users"></i> Audience Overview</h3>
    <div class="table-wrapper">
      <table class="responsive-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- CHART -->
    <div class="chart-container">
      <div class="chart-header">
        <h4 class="chart-title">
          <i class="fas fa-chart-area" style="color:var(--gold);"></i>
          <span id="chartTitle">Audience Overview</span>
        </h4>
        <div class="chart-type-wrap">
          <button class="chart-type-btn active" data-type="bar"  onclick="changeChartType('bar')"><i class="fas fa-chart-bar"></i> Bar</button>
          <button class="chart-type-btn"        data-type="line" onclick="changeChartType('line')"><i class="fas fa-chart-line"></i> Line</button>
        </div>
      </div>
      <div style="position:relative;height:320px;width:100%;"><canvas id="mainChart"></canvas></div>
      <div class="chart-legend" id="chartLegend"></div>
    </div>

  </main>
</div>

<script>
/* â”€â”€ 4 AUDIENCE METRICS â€” filas principales â”€â”€ */
var METRICS = [
  { key:"views",        label:"Views",         icon:"fas fa-play-circle",  color:"#7B2D8B", fmt:fmtNum,
    desc:"Times your content was seen" },
  { key:"interactions", label:"Interactions",  icon:"fas fa-heart",        color:"#E1306C", fmt:fmtNum,
    desc:"Likes, comments, saves & clicks" },
  { key:"newFollowers", label:"New Followers", icon:"fas fa-user-plus",    color:"#1877F2", fmt:fmtNum,
    desc:"People who followed you" },
  { key:"shares",       label:"Shares",        icon:"fas fa-share-nodes",  color:"#F77737", fmt:fmtNum,
    desc:"Times content was shared" }
];

/* â”€â”€ 5 PLATFORMS â€” sub-filas â”€â”€ */
var PLATFORMS = [
  { key:"instagram", label:"Instagram", icon:"fab fa-instagram", color:"#E1306C" },
  { key:"facebook",  label:"Facebook",  icon:"fab fa-facebook-f",color:"#1877F2" },
  { key:"tiktok",    label:"TikTok",    icon:"fab fa-tiktok",    color:"#010101" },
  { key:"youtube",   label:"YouTube",   icon:"fab fa-youtube",   color:"#FF0000" },
  { key:"pinterest", label:"Pinterest", icon:"fab fa-pinterest-p",color:"#E60023"}
];

var monthNames=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var dayNames=["SUN","MON","TUE","WED","THU","FRI","SAT"];

/* â”€â”€ SEED DATA â€” indexed by platform â”€â”€ */
function seedData(platform){
  var bases={
    instagram:{ views:920000,  interactions:38000, newFollowers:210, shares:1800 },
    facebook: { views:540000,  interactions:24000, newFollowers:140, shares:980  },
    tiktok:   { views:2800000, interactions:88000, newFollowers:380, shares:4200 },
    youtube:  { views:1400000, interactions:18000, newFollowers:95,  shares:620  },
    pinterest:{ views:180000,  interactions:8200,  newFollowers:42,  shares:280  }
  };
  var b=bases[platform]||bases.instagram;
  var data=[],now=new Date();
  var noise=function(base,pct){return Math.round(base*(1+(Math.random()-0.5)*pct));};

  for(var i=23;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var trend=1+(23-i)*0.008;
    data.push({
      platform:platform,
      year:d.getFullYear(),month:d.getMonth()+1,day:1,
      key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
      views:       noise(b.views        *trend,0.20),
      interactions:noise(b.interactions *trend,0.22),
      newFollowers:noise(b.newFollowers *trend,0.28),
      shares:      noise(b.shares       *trend,0.25)
    });
  }
  var cd=now.getDate();
  for(var d2=1;d2<=cd;d2++){
    var dn=function(base,pct){return Math.round(base/30*(1+(Math.random()-0.5)*pct));};
    data.push({
      platform:platform,
      year:now.getFullYear(),month:now.getMonth()+1,day:d2,
      key:now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(d2).padStart(2,"0"),
      views:       dn(b.views,0.35),
      interactions:dn(b.interactions,0.38),
      newFollowers:dn(b.newFollowers,0.40),
      shares:      dn(b.shares,0.38)
    });
  }
  return data;
}

var allData=[];
PLATFORMS.forEach(function(p){ allData=allData.concat(seedData(p.key)); });

/* â”€â”€ STATE â”€â”€ */
var currentFilter   ="lastYear";
var currentChartType="bar";
var hiddenSeries    =[];
var mainChart       =null;

function fmtNum(v){
  if(v>=1000000)return (v/1000000).toFixed(1)+"M";
  if(v>=1000)   return (v/1000).toFixed(1)+"K";
  return (v||0).toString();
}

/* â”€â”€ DATA HELPERS â”€â”€ */
function getVal(platKey,colKey,metricKey){
  var row=allData.find(function(d){return d.platform===platKey&&d.key===colKey;});
  return row?row[metricKey]:0;
}
function getYTD(platKey,metricKey){
  var now=new Date(),cy=now.getFullYear();
  var rows=allData.filter(function(d){return d.platform===platKey&&d.year===cy&&d.key.length===7;});
  return rows.reduce(function(a,d){return a+d[metricKey];},0);
}
function getMTD(platKey,metricKey){
  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  var rows=allData.filter(function(d){return d.platform===platKey&&d.year===cy&&d.month===cm&&d.key.length===7;});
  if(!rows.length) rows=allData.filter(function(d){return d.platform===platKey&&d.year===cy&&d.month===cm&&d.key.length>7;});
  return rows.reduce(function(a,d){return a+d[metricKey];},0);
}
function getTotalForMetric(metricKey,colKey){
  return PLATFORMS.reduce(function(acc,p){return acc+getVal(p.key,colKey,metricKey);},0);
}
function getTotalYTD(metricKey){
  return PLATFORMS.reduce(function(acc,p){return acc+getYTD(p.key,metricKey);},0);
}
function getTotalMTD(metricKey){
  return PLATFORMS.reduce(function(acc,p){return acc+getMTD(p.key,metricKey);},0);
}

function generateLast13Months(){
  var months=[],now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  for(var i=0;i<=12;i++){var m=cm-i,y=cy;while(m<=0){m+=12;y--;}months.push({year:y,month:m,key:y+"-"+String(m).padStart(2,"0")});}
  return months;
}
function generateCurrentMonthDays(){
  var days=[],now=new Date(),cd=now.getDate();
  for(var i=0;i<cd;i++){
    var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
    days.push({year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),
      dayName:dayNames[d.getDay()],monthName:monthNames[d.getMonth()],
      key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
      isToday:i===0});
  }
  return days;
}

/* â”€â”€ METRIC CARDS â”€â”€ */
function renderMetricCards(){
  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  var curKey=cy+"-"+String(cm).padStart(2,"0");
  var prevM=cm-1<=0?12:cm-1,prevY=cm-1<=0?cy-1:cy;
  var prevKey=prevY+"-"+String(prevM).padStart(2,"0");
  var fLabel=currentFilter==="yearly"?"YTD":currentFilter==="currentMonth"?"MTD":"MTD";

  var html="";
  METRICS.forEach(function(m){
    var curVal=getTotalForMetric(m.key,curKey);
    var prevVal=getTotalForMetric(m.key,prevKey)||1;
    var growth=((curVal-prevVal)/prevVal*100).toFixed(1);
    var up=parseFloat(growth)>=0;

    html+='<div class="metric-card" style="--mc-color:'+m.color+'">';
    html+='<div class="mc-header"><div class="mc-icon"><i class="'+m.icon+'"></i></div><div class="mc-check"><i class="fas fa-check"></i></div></div>';
    html+='<div class="mc-label">'+m.label+'</div>';
    html+='<div class="mc-val">'+fmtNum(curVal)+'</div>';
    html+='<div class="mc-sub">'+m.desc+' Â· '+fLabel+'</div>';
    html+='<div class="mc-growth'+(up?"":" down")+'"><i class="fas fa-arrow-'+(up?"up":"down")+'"></i> '+Math.abs(growth)+'% vs last month</div>';
    html+='</div>';
  });
  document.getElementById("metricCards").innerHTML=html;
}

/* â”€â”€ TABLE â”€â”€ */
/* Rows = METRICS (Views, Interactions, New Followers, Shares)
   Sub-rows = PLATFORMS (Instagram, Facebook, TikTok, YouTube, Pinterest) */
function renderTable(filterType){
  var head=document.getElementById("tableHead");
  var body=document.getElementById("tableBody");
  if(!head||!body)return;

  var now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  var isDay=filterType==="currentMonth",isYear=filterType==="yearly";

  var cols=[];
  if(isYear)                       cols=[{key:String(cy),label:String(cy)},{key:String(cy-1),label:String(cy-1)}];
  else if(filterType==="lastYear") cols=generateLast13Months();
  else                             cols=generateCurrentMonthDays();

  /* HEADER */
  var hr="<tr><th style='min-width:240px;'>METRIC / PLATFORM</th>";
  if(!isYear) hr+="<th>YTD</th><th>MTD</th>";
  cols.forEach(function(col){
    if(isDay){var lbl=col.isToday?"TODAY":col.dayName;hr+='<th><div class="th-content"><span class="th-month">'+lbl+'</span><span class="th-year">'+col.monthName+' '+col.day+'</span></div></th>';}
    else if(isYear){hr+='<th><div class="th-content"><span class="th-month">'+col.label+'</span></div></th>';}
    else{hr+='<th><div class="th-content"><span class="th-month">'+monthNames[col.month-1]+'</span><span class="th-year">'+col.year+'</span></div></th>';}
  });
  hr+="</tr>";
  head.innerHTML=hr;

  var html="";

  /* Una fila principal por MÃ‰TRICA */
  METRICS.forEach(function(m){
    var mYTD=getTotalYTD(m.key);
    var mMTD=getTotalMTD(m.key);

    html+='<tr class="metric-main-row" data-metric="'+m.key+'">';
    html+='<td><div class="metric-main-cell">';
    html+='<div class="metric-main-icon" style="background:'+m.color+'"><i class="'+m.icon+'"></i></div>';
    html+='<span class="toggle-icon" id="icon_'+m.key+'" onclick="togglePlatformRows(\''+m.key+'\')">▶</span>';
    html+='<strong style="font-size:14px;cursor:pointer;" onclick="togglePlatformRows(\''+m.key+'\')">'+m.label+'</strong>';
    html+='</div></td>';
    if(!isYear){
      html+='<td><strong>'+m.fmt(mYTD)+'</strong></td>';
      html+='<td>'+m.fmt(mMTD)+'</td>';
    }
    cols.forEach(function(col){
      html+='<td><strong>'+m.fmt(getTotalForMetric(m.key,col.key))+'</strong></td>';
    });
    html+='</tr>';

    /* Sub-filas: una por PLATAFORMA */
    PLATFORMS.forEach(function(p){
      var pYTD=getYTD(p.key,m.key);
      var pMTD=getMTD(p.key,m.key);

      html+='<tr class="platform-sub-row" data-metric="'+m.key+'" style="display:none;">';
      html+='<td><div class="platform-sub-cell">';
      html+='<div class="platform-sub-badge" style="background:'+p.color+'"><i class="'+p.icon+'" style="color:#fff;font-size:12px;"></i></div>';
      html+='<span style="font-size:13px;font-weight:500;color:var(--text);">'+p.label+'</span>';
      html+='</div></td>';
      if(!isYear){
        html+='<td>'+m.fmt(pYTD)+'</td>';
        html+='<td>'+m.fmt(pMTD)+'</td>';
      }
      cols.forEach(function(col){
        html+='<td>'+m.fmt(getVal(p.key,col.key,m.key))+'</td>';
      });
      html+='</tr>';
    });
  });

  body.innerHTML=html;
  renderChart(filterType,cols);
}

function togglePlatformRows(metricKey){
  var rows=document.querySelectorAll('.platform-sub-row[data-metric="'+metricKey+'"]');
  var icon=document.getElementById("icon_"+metricKey);
  var collapsed=icon&&icon.textContent==="▶";
  rows.forEach(function(r){r.style.display=collapsed?"table-row":"none";});
  if(icon)icon.textContent=collapsed?"▼":"▶";
}

/* â”€â”€ CHART â€” una lÃ­nea/barra por mÃ©trica â”€â”€ */
function renderChart(filterType,cols){
  var ctx=document.getElementById("mainChart");
  if(!ctx)return;
  if(mainChart)mainChart.destroy();

  var labels=cols.map(function(col){
    if(filterType==="currentMonth")return (col.isToday?"TODAY":col.dayName)+"\n"+col.monthName+" "+col.day;
    if(filterType==="yearly")return col.label||col.key;
    return monthNames[col.month-1]+"\n"+col.year;
  });

  var datasets=[];
  METRICS.forEach(function(m){
    if(hiddenSeries.includes(m.key))return;
    var vals=cols.map(function(col){return getTotalForMetric(m.key,col.key);});
    datasets.push({
      label:m.label,data:vals,
      backgroundColor:currentChartType==="bar"?m.color+"BB":m.color+"22",
      borderColor:m.color,borderWidth:2,
      borderRadius:currentChartType==="bar"?4:0,
      fill:currentChartType==="line",tension:0.4,
      pointBackgroundColor:m.color,pointBorderColor:'#fff',
      pointBorderWidth:2,pointRadius:3,pointHoverRadius:5
    });
  });

  mainChart=new Chart(ctx,{
    type:currentChartType,
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{intersect:false,mode:'index'},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(30,34,39,0.95)',titleColor:'#fff',bodyColor:'#fff',
          borderColor:'rgb(171,160,110)',borderWidth:1,cornerRadius:8,padding:12,
          callbacks:{label:function(c){
            var m=METRICS.find(function(x){return x.label===c.dataset.label;});
            return c.dataset.label+": "+(m?m.fmt(c.parsed.y):c.parsed.y);
          }}
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#888',font:{size:10},maxRotation:45}},
        y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#888',font:{size:11},callback:function(v){return fmtNum(v);}}}
      }
    }
  });

  document.getElementById("chartTitle").textContent="Audience Overview by Platform";

  var lc=document.getElementById("chartLegend");
  lc.innerHTML=METRICS.map(function(m){
    var dis=hiddenSeries.includes(m.key)?"opacity:0.4;":"";
    return '<div onclick="toggleChartSeries(\''+m.key+'\')" style="display:flex;align-items:center;gap:6px;font-size:12px;color:#535255;cursor:pointer;padding:4px 8px;border-radius:6px;'+dis+'">'
      +'<span style="width:12px;height:12px;border-radius:3px;background:'+m.color+';display:inline-block;"></span>'+m.label+'</div>';
  }).join('');
}

function toggleChartSeries(key){
  var idx=hiddenSeries.indexOf(key);
  if(idx>-1)hiddenSeries.splice(idx,1);else hiddenSeries.push(key);
  var cols=currentFilter==="lastYear"?generateLast13Months():currentFilter==="currentMonth"?generateCurrentMonthDays():[{key:String(new Date().getFullYear()),label:String(new Date().getFullYear())},{key:String(new Date().getFullYear()-1),label:String(new Date().getFullYear()-1)}];
  renderChart(currentFilter,cols);
  document.getElementById("chartLegend").querySelectorAll("div").forEach(function(el){
    var met=METRICS.find(function(x){return x.label===el.textContent.trim();});
    if(met)el.style.opacity=hiddenSeries.includes(met.key)?"0.4":"1";
  });
}

function changeChartType(type){
  currentChartType=type;
  document.querySelectorAll(".chart-type-btn").forEach(function(b){b.classList.toggle("active",b.dataset.type===type);});
  renderTable(currentFilter);
}

function applyFilter(filterType){
  currentFilter=filterType;
  document.querySelectorAll("#dateFilters .filter-btn").forEach(function(b){b.classList.toggle("active",b.dataset.filter===filterType);});
  renderMetricCards();
  renderTable(filterType);
}

document.addEventListener("DOMContentLoaded",function(){
  renderMetricCards();
  renderTable("lastYear");
});
</script>
</body>
