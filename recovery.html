<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #f4f4f2;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #77736a;
      --border: #e6e2d9;
      --gold: #ab9f6e;
      --gold-dark: #8f8454;
      --gold-soft: rgba(171, 159, 110, 0.12);
      --shadow: 0 24px 60px rgba(31, 35, 40, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(171,159,110,0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(31,35,40,0.08), transparent 30%),
        linear-gradient(180deg, #f8f7f4 0%, var(--bg) 100%);
    }

    .shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hero {
      display: none;
    }

    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      border-radius: 999px;
      filter: blur(3px);
      opacity: 0.9;
      pointer-events: none;
    }

    .hero::before {
      width: 240px;
      height: 240px;
      background: rgba(171, 159, 110, 0.16);
      top: -60px;
      left: -40px;
    }

    .hero::after {
      width: 320px;
      height: 320px;
      background: rgba(31, 35, 40, 0.08);
      bottom: -130px;
      right: -120px;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .brand-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 18px 36px rgba(171, 159, 110, 0.35);
      flex-shrink: 0;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand-copy p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .headline {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin-top: auto;
      margin-bottom: 40px;
      animation: rise 0.7s ease-out both;
    }

    .headline h2 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 5vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .headline h2 span {
      color: var(--gold);
    }

    .headline p {
      margin: 0;
      max-width: 520px;
      color: #5d5a52;
      font-size: 15px;
      line-height: 1.7;
    }

    .feature-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      max-width: 440px;
    }

    .feature {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid rgba(171, 159, 110, 0.2);
      background: rgba(255,255,255,0.5);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .feature i {
      color: var(--gold-dark);
      margin-top: 2px;
    }

    .feature strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .feature span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .card-side {
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-left: none;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px;
      position: relative;
      overflow: hidden;
      animation: rise 0.7s ease-out both;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(171,159,110,0.08), transparent 24%);
      pointer-events: none;
    }

    .card-header {
      position: relative;
      z-index: 1;
      margin-bottom: 22px;
      text-align: center;
    }

    .recovery-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .recovery-logo img {
      width: 180px;
      max-width: 100%;
      display: block;
    }

    .card-header h3 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .card-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .mode-switch {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      margin: 18px 0 18px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: #4b4a46;
      border-radius: 14px;
      padding: 14px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      transform: translateY(-1px);
    }

    .mode-btn.active {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold-dark);
      box-shadow: 0 10px 24px rgba(171, 159, 110, 0.16);
    }

    .form {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #4b4a46;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(171,159,110,0.14);
    }

    .note {
      margin: -4px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    .primary {
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(171,159,110,0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(171,159,110,0.34);
    }

    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 600;
      background: #fff;
      transition: all 0.2s ease;
    }

    .secondary:hover {
      border-color: var(--gold);
      color: var(--gold-dark);
      background: #fcfbf8;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.success {
      display: block;
      background: rgba(65, 150, 84, 0.08);
      border-color: rgba(65, 150, 84, 0.22);
      color: #256334;
    }

    .status.error {
      display: block;
      background: rgba(217, 83, 79, 0.08);
      border-color: rgba(217, 83, 79, 0.22);
      color: #9d2f2a;
    }

    .status i {
      margin-right: 8px;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 28px 22px 10px;
      }

      .card-side {
        border-left: none;
        border-top: 1px solid rgba(230, 226, 217, 0.9);
        padding: 22px;
      }

      .headline {
        margin-bottom: 24px;
      }
    }

    @media (max-width: 560px) {
      .hero, .card-side {
        padding-left: 16px;
        padding-right: 16px;
      }

      .card {
        padding: 22px;
      }

      .mode-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div></div>
    </section>

    <section class="card-side">
      <div class="card">
        <div class="card-header">
          <div class="recovery-logo">
            <img src="img/Niche-Logo-blaco.png" alt="Brand Portal logo">
          </div>
          <h3>Forgot username or password?</h3>
          <p>Select the type of recovery you need .</p>
        </div>

        <div class="mode-switch">
          <div class="mode-grid">
            <button type="button" class="mode-btn active" data-mode="password" onclick="setMode('password')">
              <i class="fas fa-key"></i> Password
            </button>
            <button type="button" class="mode-btn" data-mode="username" onclick="setMode('username')">
              <i class="fas fa-user"></i> Username
            </button>
          </div>
        </div>

        <form class="form" id="recoveryForm">
          <div class="field">
            <label for="recoveryEmail">Email address</label>
            <input id="recoveryEmail" type="email" placeholder="your@email.com" required>
            <p class="note">Use the email connected to your Brand Portal account.</p>
          </div>

          <div class="field" id="extraFieldWrap">
            <label id="extraFieldLabel" for="extraField">New password</label>
            <input id="extraField" type="text" placeholder="Enter a new password">
          </div>

          <div class="actions">
            <button class="primary" type="submit" id="submitBtn">
              <i class="fas fa-paper-plane"></i> Send recovery request
            </button>
            <a class="secondary" href="index.html">
              <i class="fas fa-arrow-left"></i> Back to login
            </a>
          </div>

          <div class="status" id="statusBox"></div>
        </form>

        <div class="footer">If this were connected to a backend, the request would be sent from here.</div>
      </div>
    </section>
  </div>

  <script>
    var currentMode = 'password';
    var extraFieldWrap = document.getElementById('extraFieldWrap');
    var extraFieldLabel = document.getElementById('extraFieldLabel');
    var extraField = document.getElementById('extraField');
    var statusBox = document.getElementById('statusBox');
    var submitBtn = document.getElementById('submitBtn');
    var recoveryForm = document.getElementById('recoveryForm');

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      statusBox.className = 'status';
      statusBox.textContent = '';

      if (mode === 'password') {
        extraFieldWrap.style.display = 'block';
        extraFieldLabel.textContent = 'New password';
        extraField.type = 'password';
        extraField.placeholder = 'Enter a new password';
        extraField.required = true;
      } else {
        extraFieldWrap.style.display = 'none';
        extraField.required = false;
        extraField.value = '';
      }
    }

    recoveryForm.addEventListener('submit', function (e) {
      e.preventDefault();

      var email = document.getElementById('recoveryEmail').value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

      window.setTimeout(function () {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send recovery request';

        if (currentMode === 'password') {
          statusBox.className = 'status success';
          statusBox.innerHTML = '<i class="fas fa-circle-check"></i> Password recovery request sent to <strong>' + email + '</strong>. Check your inbox for the next steps.';
        } else {
          statusBox.className = 'status success';
          statusBox.innerHTML = '<i class="fas fa-circle-check"></i> Username reminder sent to <strong>' + email + '</strong>. Check your inbox for the details.';
        }
      }, 900);
    });

    setMode('password');
  </script>
</body>
</html>
